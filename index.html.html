<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CANAL PRIVE // TERMINAL</title>
<style>
:root{--green:#00ff66;--dim:#00a344;--dark:#003b18;--bg:#000}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--green);font-family:"Courier New",Courier,monospace;display:flex;flex-direction:column}
#screen{flex:1;overflow-y:auto;padding:14px;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.line{margin:0 0 10px}
.meta{color:var(--dim)}
.sys{color:#00d15e}
.err{color:#ff5555}
#bar{padding:8px 12px;border-top:1px solid var(--dark);border-bottom:1px solid var(--dark);font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:10px}
#form{display:flex;gap:8px;padding:10px;background:#000}
#msg{flex:1;min-width:0;background:#000;border:1px solid var(--dim);color:var(--green);font-family:inherit;font-size:16px;padding:12px;outline:none}
#msg:focus{border-color:var(--green)}
#send{background:#001a0c;border:1px solid var(--green);color:var(--green);font-family:inherit;padding:12px 16px;cursor:pointer}
#send:hover{background:var(--green);color:#000}
#login{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}
#box{width:100%;max-width:430px;border:1px solid var(--dim);padding:20px}
#box h1{font-size:17px;margin:0 0 6px;letter-spacing:1px}
#box p{margin:0 0 16px;color:var(--dim);font-size:12px}
#box input{width:100%;background:#000;border:1px solid var(--dim);color:var(--green);font-family:inherit;font-size:16px;padding:12px;margin-bottom:10px;outline:none}
#box input:focus{border-color:var(--green)}
#box button{width:100%;background:#001a0c;border:1px solid var(--green);color:var(--green);font-family:inherit;padding:12px;cursor:pointer}
#box button:hover{background:var(--green);color:#000}
#note{margin-top:12px;font-size:11px;color:var(--dim)}
#diag{margin-top:10px;font-size:11px;color:#ff8888;white-space:pre-wrap}
</style>
</head>
<body>

<div id="login">
  <div id="box">
    <h1>CANAL PRIVE // TERMINAL</h1>
    <p>Entrez le meme code secret sur les deux appareils. La connexion Internet est necessaire.</p>
    <input id="code" type="password" placeholder="CODE SECRET" autocomplete="off">
    <input id="pseudo" placeholder="TON PSEUDO" autocomplete="off">
    <button id="enter">SE CONNECTER</button>
    <div id="note">Les messages restent dans l'historique de cet appareil et ne peuvent pas etre supprimes depuis l'application.</div>
    <div id="diag"></div>
  </div>
</div>

<div id="screen"></div>
<div id="bar"><span id="status">HORS LIGNE</span><span id="channel"></span></div>
<form id="form">
  <input id="msg" placeholder="> ecrire un message..." autocomplete="off">
  <button id="send" type="submit">ENVOYER</button>
</form>

<script>
const NTFY='https://ntfy.sh';
const screen=document.getElementById('screen');
const statusEl=document.getElementById('status');
const channelEl=document.getElementById('channel');
const form=document.getElementById('form');
const input=document.getElementById('msg');
const diag=document.getElementById('diag');
let source=null, topic='', pseudo='', code='';

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function addLine(html,cls=''){
  const d=document.createElement('div');
  d.className='line '+cls;
  d.innerHTML=html;
  screen.appendChild(d);
  screen.scrollTop=screen.scrollHeight;
}

function now(){return new Date().toLocaleString('fr-FR')}

function saveHistory(list){
  try{localStorage.setItem('terminal_history_'+code,JSON.stringify(list))}catch(e){}
}

function loadHistory(){
  try{return JSON.parse(localStorage.getItem('terminal_history_'+code)||'[]')}catch{return[]}
}

function addMessage(author,text,time){
  const history=loadHistory();
  history.push({author,text,time});
  saveHistory(history);
  addLine('<span class="meta">['+esc(time)+']</span> <span class="meta">'+esc(author)+':</span> '+esc(text));
}

function addSystem(text,cls='sys'){
  addLine('<span class="meta">['+now()+']</span> [SYSTEME] '+esc(text),cls);
}

function hash(text){
  let h=5381;
  for(let i=0;i<text.length;i++){h=((h<<5)+h+text.charCodeAt(i))>>>0}
  return h.toString(36);
}

function disconnect(){
  if(source){try{source.close()}catch(e){}}
  source=null;
  statusEl.textContent='HORS LIGNE';
}

function connect(){
  code=document.getElementById('code').value.trim();
  pseudo=document.getElementById('pseudo').value.trim();
  diag.textContent='';

  if(!code||!pseudo){diag.textContent='ERREUR : entre un code secret et un pseudo.';return}
  if(!navigator.onLine){diag.textContent='ERREUR : aucun acces Internet detecte.';return}

  localStorage.setItem('terminal_last_code',code);
  localStorage.setItem('terminal_last_pseudo',pseudo);

  topic='canal-terminal-prive-'+hash(code);
  document.getElementById('login').style.display='none';
  channelEl.textContent='CANAL : '+code.slice(0,3)+'...'+code.slice(-3);
  statusEl.textContent='CONNEXION...';

  disconnect();

  try{
    source=new EventSource(NTFY+'/'+topic+'/sse');
  }catch(e){
    diag.textContent='ERREUR : le navigateur a bloque la connexion.\n'+e.message;
    return;
  }

  source.onopen=()=>{
    statusEl.textContent='EN LIGNE';
    addSystem('CANAL PRIVE ACTIF.');
    addSystem('PSEUDO : '+pseudo);
    addSystem('LES MESSAGES ENVOYES NE PEUVENT PAS ETRE SUPPRIMES DEPUIS CETTE PAGE.');
    const history=loadHistory();
    if(history.length){
      addSystem('HISTORIQUE LOCAL RESTAURE : '+history.length+' MESSAGE(S).');
      history.forEach(m=>addLine('<span class="meta">['+esc(m.time)+']</span> <span class="meta">'+esc(m.author)+':</span> '+esc(m.text)));
    }
  };

  source.onmessage=event=>{
    try{
      const data=JSON.parse(event.data);
      if(data.event==='message'&&data.message){
        let text=data.message;
        let author='INCONNU';
        try{
          const parsed=JSON.parse(text);
          if(parsed&&parsed.pseudo&&typeof parsed.text==='string'){
            author=parsed.pseudo;
            text=parsed.text;
          }
        }catch(e){}
        if(author!==pseudo)addMessage(author,text,now());
      }
    }catch(e){}
  };

  source.onerror=()=>{
    statusEl.textContent='RECONNEXION...';
  };
}

document.getElementById('enter').onclick=connect;
document.getElementById('code').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('pseudo').focus()});
document.getElementById('pseudo').addEventListener('keydown',e=>{if(e.key==='Enter')connect()});

form.addEventListener('submit',async e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text)return;
  if(!source||source.readyState!==1){addSystem('PAS CONNECTE : reessaie dans quelques secondes.','err');return}
  const time=now();
  try{
    const r=await fetch(NTFY+'/',{
      method:'POST',
      headers:{'Topic':topic,'Title':'Message','Tags':'terminal'},
      body:JSON.stringify({pseudo,text})
    });
    if(!r.ok){addSystem('ENVOI IMPOSSIBLE : code '+r.status+'.','err');return}
    addMessage(pseudo,text,time);
    input.value='';
  }catch(err){
    addSystem('ENVOI IMPOSSIBLE : verifie ta connexion Internet.','err');
  }
});

const lastCode=localStorage.getItem('terminal_last_code');
const lastPseudo=localStorage.getItem('terminal_last_pseudo');
if(lastCode)document.getElementById('code').value=lastCode;
if(lastPseudo)document.getElementById('pseudo').value=lastPseudo;
</script>
</body>
</html>
